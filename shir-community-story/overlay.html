<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<title>Story caption overlay</title>
<link rel="stylesheet" href="fonts/rubik-local.css" />
<style>
  :root {
    --turq: #19a9ab;       /* CarpetDM studio-wall turquoise */
    --turq-bright: #5ff0e8;
    --ink: #0d1414;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  body.preview { background: #333 url(preview-bg.png) center/cover no-repeat; }
  #stage { position: absolute; inset: 0; font-family: "Rubik", "Noto Color Emoji", sans-serif; }

  /* Caption block: bottom-anchored over the chest, clear of the face and of IG's bottom UI */
  #cap {
    position: absolute; left: 70px; right: 70px; bottom: 250px;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
    gap: 6px 18px; direction: rtl; text-align: center;
    transform-origin: 50% 100%;
  }
  .w {
    display: inline-block; position: relative;
    font-weight: 900; font-size: 92px; line-height: 1.12; color: #fff;
    -webkit-text-stroke: 16px var(--ink); paint-order: stroke fill;
    text-shadow: 0 9px 0 rgba(0,0,0,.28);
    padding: 2px 10px; border-radius: 22px;
    transform-origin: 50% 60%;
    white-space: nowrap;
  }
  .w.active { color: var(--turq-bright); }
  .w.key { font-size: 104px; }
  .w.key.on {
    background: var(--turq); color: #fff; -webkit-text-stroke: 0; text-shadow: none;
    padding: 4px 26px 10px; box-shadow: 0 10px 0 rgba(0,0,0,.25);
  }
  #cap.punch .w { font-size: 100px; }
  #cap.punch .w.key { font-size: 108px; }
  #cap.stack { gap: 0 14px; align-items: baseline; }
  #cap.stack .w:nth-child(1) { font-size: 80px; }
  #cap.stack .w:nth-child(2) { font-size: 98px; }
  #cap.stack .w:nth-child(3) { font-size: 120px; }

  /* Emoji sticker sits inline at the end of the caption line, so it never lands on the face */
  #emoji {
    display: inline-block; font-size: 112px; line-height: 1; margin-inline-start: 4px;
    font-family: "Noto Color Emoji", sans-serif;
    filter: drop-shadow(0 8px 0 rgba(0,0,0,.25));
    opacity: 0;
  }

  /* "Join through the link" callout. The real IG link sticker goes in the zone under the hand. */
  #link { position: absolute; left: 0; right: 0; top: 205px; display: flex; flex-direction: column; align-items: center; opacity: 0; }
  #link .pill {
    background: #fff; color: var(--turq); font-weight: 900; font-size: 56px;
    padding: 12px 38px 16px; border-radius: 999px; box-shadow: 0 8px 0 rgba(0,0,0,.25);
    white-space: nowrap;
  }
  #link .hand { font-family: "Noto Color Emoji"; font-size: 84px; margin-top: 6px; filter: drop-shadow(0 6px 0 rgba(0,0,0,.25)); }
</style>
</head>
<body>
<div id="stage">
  <div id="emoji"></div>
  <div id="cap"></div>
  <div id="link"><div class="pill">הצטרפו לקהילה בקישור</div><div class="hand">👇</div></div>
</div>
<script src="captions.js"></script>
<script>
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const easeOutBack = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const LEAD = 0.05; // show words slightly before they are spoken

  // Resolve each chunk's start/end.
  CHUNKS.forEach((c, i) => {
    c.start = c.words[0][1] - LEAD;
    const next = CHUNKS[i + 1];
    c.end = c.end ?? (next ? next.words[0][1] - LEAD : TRIM.end);
  });

  const cap = document.getElementById("cap");
  const emo = document.getElementById("emoji");
  const link = document.getElementById("link");
  let built = -1;

  function build(i) {
    if (built === i) return;
    built = i;
    cap.innerHTML = "";
    cap.className = "";
    if (i < 0) return;
    const c = CHUNKS[i];
    if (c.style) cap.classList.add(c.style);
    c.words.forEach(([txt, , fl]) => {
      const s = document.createElement("span");
      s.className = "w" + (fl === "k" ? " key" : "");
      s.textContent = txt;
      cap.appendChild(s);
    });
    emo.textContent = c.emoji || "";
    emo.style.display = c.emoji ? "inline-block" : "none";
    cap.appendChild(emo); // after the words = left end of the RTL line
  }

  window.renderAt = function (t) {
    const i = CHUNKS.findIndex((c) => t >= c.start && t < c.end);
    build(i);
    if (i < 0) { emo.style.opacity = 0; } else {
      const c = CHUNKS[i];
      const age = t - c.start;
      // Chunk entrance: quick rise + fade
      const e = easeOut(clamp(age / 0.16));
      cap.style.opacity = e;
      cap.style.transform = `translateY(${(1 - e) * 26}px)`;

      const spans = cap.children;
      let activeIdx = -1;
      c.words.forEach(([, ws], j) => { if (t >= ws - LEAD) activeIdx = j; });
      c.words.forEach(([, ws, fl], j) => {
        const s = spans[j];
        const wa = t - (ws - LEAD);
        const shown = wa >= 0 || j === 0;
        s.style.opacity = shown ? 1 : 0;
        let sc = 1;
        if (wa >= 0) {
          const p = clamp(wa / 0.2);
          sc = 0.55 + 0.45 * easeOutBack(p);
        }
        if (j === activeIdx) sc *= 1.06;
        let rot = 0;
        if (c.style === "punch") rot = -3;
        if (fl === "k" && wa >= 0) rot += (j % 2 ? 2 : -2) * clamp(1 - wa / 0.35);
        s.style.transform = `scale(${sc}) rotate(${rot}deg)`;
        s.classList.toggle("active", j === activeIdx && fl !== "k");
        s.classList.toggle("on", fl === "k" && wa >= 0);
      });

      // Emoji sticker: pops in after the chunk starts, gentle wobble
      if (c.emoji) {
        const ea = age - 0.1;
        const p = clamp(ea / 0.3);
        const sc = ea < 0 ? 0 : easeOutBack(p);
        emo.style.opacity = ea < 0 ? 0 : 1;
        emo.style.transform = `scale(${sc}) rotate(${Math.sin(t * 5) * 8 + (i % 2 ? -10 : 10)}deg)`;
      } else emo.style.opacity = 0;
    }

    // Link callout
    let lo = 0, la = 0;
    for (const [a, b] of LINK_CALLOUTS) if (t >= a && t < b) { la = t - a; lo = Math.min(clamp(la / 0.25), clamp((b - t) / 0.25)); }
    link.style.opacity = lo;
    const bounce = Math.abs(Math.sin(t * Math.PI * 1.6)) * 18;
    link.style.transform = `scale(${0.8 + 0.2 * easeOutBack(clamp(la / 0.35))})`;
    link.querySelector(".hand").style.transform = `translateY(${bounce}px)`;
  };

  const q = new URLSearchParams(location.search);
  if (q.has("preview")) { document.body.classList.add("preview"); }
  if (q.has("t")) document.fonts.ready.then(() => renderAt(parseFloat(q.get("t"))));
</script>
</body>
</html>
