<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #f5efe0;
        --ink: #2b2620;
        --font-display: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        flex-direction: column;
        justify-content: center;
        background: var(--ground);
        font-family: var(--font-display);
        color: var(--ink);
      }
      #title, #subtitle {
        position: absolute;
        left: 0;
        width: 100%;
        text-align: center;
      }
      #title {
        top: 400px;
        height: 180px;
        font-size: 160px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      #subtitle {
        top: 610px;
        height: 70px;
        font-size: 56px;
        font-weight: 400;
        line-height: 1.2;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <h1 id="title" class="clip" data-start="0" data-duration="5" data-track-index="0">CarpetDM</h1>
      <p id="subtitle" class="clip" data-start="0" data-duration="5" data-track-index="1">HyperFrames Cloud Test</p>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 1, ease: "power2.out" }, 0.2);
      tl.fromTo("#subtitle", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 1, ease: "power2.out" }, 0.5);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
